<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Electron App</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    p  { color: #a0a0b0; }
    button {
      margin-top: 20px;
      padding: 10px 24px;
      font-size: 1rem;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #5a4bd1; }
  </style>
</head>
<body>
  <h1>سلام از Electron! 👋</h1>
  <p>این یک اپ ساده ویندوز است که با GitHub Actions ساخته می‌شود.</p>
  <button onclick="alert('دکمه کار می‌کند!')">کلیک کن</button>
</body>
</html>
